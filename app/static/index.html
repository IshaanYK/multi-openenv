<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Work OS Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="glass-bg"></div>
    
    <header class="navbar glass-panel">
        <div class="logo">
            <div class="logo-icon"></div>
            <h1>AI Work OS</h1>
        </div>
        <div class="header-actions">
            <div class="step-badge">Step: <span id="env-step">-</span></div>
            <button id="btn-baseline" class="btn btn-secondary">Run Baseline Agent</button>
            <button id="btn-reset" class="btn btn-primary">Reset Environment</button>
        </div>
    </header>

    <main class="dashboard-grid">
        
        <!-- Left Column: Available Tasks & Action Form -->
        <section class="left-col">
            <div class="panel glass-panel">
                <h2>Incoming Inbox</h2>
                <div class="tasks-tabs">
                    <button class="tab active" data-difficulty="easy">Priority</button>
                    <button class="tab" data-difficulty="medium">Internal</button>
                    <button class="tab" data-difficulty="hard">Escalation</button>
                </div>
                <div class="tasks-list-container" id="tasks-list">
                    <!-- Tasks will be injected here -->
                </div>
            </div>

            <div class="panel glass-panel mt-4 action-panel">
                <h2>Execution Control</h2>
                <form id="action-form">
                    <div class="form-group">
                        <label>Target Task ID</label>
                        <input type="text" id="action-task-id" placeholder="e.g. REQ_101" required>
                    </div>
                    <div class="form-group">
                        <label>Action Protocol</label>
                        <select id="action-type" required>
                            <option value="classify">Analyze & Classify</option>
                            <option value="schedule">Coordinate Meeting</option>
                            <option value="refund">Process Transaction</option>
                            <option value="reply">Compose Reply</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Interface Tool</label>
                        <select id="action-tool" required>
                            <option value="classify_text">Natural Language Parsing</option>
                            <option value="schedule_meeting">Calender Integrator</option>
                            <option value="process_refund">Payment Gateway</option>
                            <option value="send_email">SMTP Relay</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Operational Rationale</label>
                        <textarea id="action-message" rows="2" placeholder="Briefly explain the decision..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Dispatch Agent Action</button>
                </form>
            </div>
        </section>

        <!-- Center Column: Environment State (Active Tasks) -->
        <section class="center-col">
            <div class="panel glass-panel">
                <h2>Active Workplace Stack</h2>
                <div id="env-tasks" class="env-tasks-grid">
                    <p class="text-muted">Initializing workspace...</p>
                </div>
            </div>
        </section>

        <!-- Right Column: Metrics & Logs -->
        <section class="right-col">
            <div class="panel glass-panel">
                <h2>Performance Tracing</h2>
                <div class="metrics-grid" id="metrics-container">
                    <!-- Metrics will be injected here -->
                    <p class="text-muted">Standby for simulation.</p>
                </div>
            </div>

            <div class="panel glass-panel mt-4 logs-panel">
                <h2>Agent Collaboration</h2>
                <div class="logs-container" id="logs-container">
                    <p class="text-muted">Communications offline.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="/static/app.js"></script>
</body>
</html>

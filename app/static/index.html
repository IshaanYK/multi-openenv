<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Work OS Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="glass-bg"></div>
    
    <header class="navbar glass-panel">
        <div class="logo">
            <div class="logo-icon"></div>
            <h1>AI Work OS</h1>
        </div>
        <div class="header-actions">
            <div class="step-badge">Step: <span id="env-step">-</span></div>
            <button id="btn-baseline" class="btn btn-secondary">Run Baseline Agent</button>
            <button id="btn-reset" class="btn btn-primary">Reset Environment</button>
        </div>
    </header>

    <main class="dashboard-grid">
        
        <!-- Left Column: Available Tasks & Action Form -->
        <section class="left-col">
            <div class="panel glass-panel">
                <h2>System Tasks</h2>
                <div class="tasks-tabs">
                    <button class="tab active" data-difficulty="easy">Easy</button>
                    <button class="tab" data-difficulty="medium">Medium</button>
                    <button class="tab" data-difficulty="hard">Hard</button>
                </div>
                <div class="tasks-list-container" id="tasks-list">
                    <!-- Tasks will be injected here -->
                </div>
            </div>

            <div class="panel glass-panel mt-4 action-panel">
                <h2>Take Action</h2>
                <form id="action-form">
                    <div class="form-group">
                        <label>Task ID</label>
                        <input type="text" id="action-task-id" placeholder="e.g. task_001" required>
                    </div>
                    <div class="form-group">
                        <label>Action Type</label>
                        <select id="action-type" required>
                            <option value="classify">Classify</option>
                            <option value="schedule">Schedule</option>
                            <option value="refund">Refund</option>
                            <option value="reply">Reply</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tool</label>
                        <select id="action-tool" required>
                            <option value="classify_text">classify_text</option>
                            <option value="schedule_meeting">schedule_meeting</option>
                            <option value="process_refund">process_refund</option>
                            <option value="send_email">send_email</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Message / Note</label>
                        <textarea id="action-message" rows="2" placeholder="Optional details..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Submit Action</button>
                </form>
            </div>
        </section>

        <!-- Center Column: Environment State (Active Tasks) -->
        <section class="center-col">
            <div class="panel glass-panel full-height">
                <h2>Pending Environment Tasks</h2>
                <div id="env-tasks" class="env-tasks-grid">
                    <p class="text-muted">Loading environment state...</p>
                </div>
            </div>
        </section>

        <!-- Right Column: Metrics & Logs -->
        <section class="right-col">
            <div class="panel glass-panel">
                <h2>Performance Metrics</h2>
                <div class="metrics-grid" id="metrics-container">
                    <!-- Metrics will be injected here -->
                    <p class="text-muted">No metrics yet.</p>
                </div>
            </div>

            <div class="panel glass-panel mt-4 logs-panel">
                <h2>Agent Logs</h2>
                <div class="logs-container" id="logs-container">
                    <p class="text-muted">No logs recorded.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="/static/app.js"></script>
</body>
</html>

[project]
name = "ai-work-os"
version = "0.1.0"
description = "Multi-agent OpenEnv environment for real-world task simulation"
authors = [
    { name = "Ishaan Sen" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
entrypoint = "api.main:app"
